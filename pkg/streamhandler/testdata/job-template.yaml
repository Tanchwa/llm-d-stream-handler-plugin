apiVersion: batch/v1
kind: Job
metadata:
  name: handler-${SESSION_ID}
  namespace: cellphone-camera
  labels:
    app.kubernetes.io/name: cellphone-camera-handler
    app.kubernetes.io/component: handler
    app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
    # Lets the hook (or a human) find and delete a session's handler:
    #   kubectl -n cellphone-camera delete job -l cellphone-camera.io/session-id=<id>
    cellphone-camera.io/session-id: "${SESSION_ID}"
spec:
  # Never retry. Exit 1 means the stream never produced a frame and exit 2
  # means the config is wrong -- neither gets better on a second attempt,
  # and the caller's token stream is already gone by then.
  backoffLimit: 0
  # Hard ceiling from the API server's side, independent of the handler's
  # own MAX_SESSION_SECONDS (300). Keep this above it so a healthy session
  # ends on its own backstop and reports a real exit code, and only a hung
  # handler gets killed here.
  activeDeadlineSeconds: 360
  # Keep finished Jobs around briefly for log retrieval, then self-clean so
  # a busy gateway does not accumulate thousands of Job objects.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cellphone-camera-handler
        app.kubernetes.io/component: handler
        app.kubernetes.io/part-of: cellphone-camera-rtsp-ingestor
        cellphone-camera.io/session-id: "${SESSION_ID}"
    spec:
      restartPolicy: Never
      serviceAccountName: cellphone-camera-handler
      # The handler talks to no Kubernetes API -- it reads a camera stream
      # and POSTs to a pool. It needs no token.
      automountServiceAccountToken: false
      # The worker handles SIGTERM and shuts the stream down cleanly.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: handler
          # Pin to the SHA tag in production; `latest` here so the hook
          # keeps working after a merge to main without a template edit.
          image: docker.io/tanchwa/cellphone-camera-handler:latest
          imagePullPolicy: IfNotPresent
          # No ports. Nothing connects to the handler; it only dials out.
          envFrom:
            - configMapRef:
                name: cellphone-camera-handler-defaults
            - secretRef:
                name: cellphone-camera-handler-secrets
                optional: true
          # `env` beats `envFrom`, so these override the defaults above.
          env:
            - name: SESSION_ID
              value: "${SESSION_ID}"
            - name: STREAM_URL
              value: "${STREAM_URL}"
            - name: POOL_ENDPOINT
              value: "${POOL_ENDPOINT}"
            # The return path: without this the handler has nowhere to send
            # the model's output and the session produces nothing visible.
            - name: RESULTS_CALLBACK_URL
              value: "${RESULTS_CALLBACK_URL}"
            # Omit these two entirely if the user did not override them.
            - name: PROMPT
              value: "${PROMPT}"
            - name: FRAME_INTERVAL
              value: "${FRAME_INTERVAL}"
          resources:
            requests:
              # Decoding the stream and re-encoding JPEGs is the whole job.
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # OpenCV and Python both want somewhere writable.
        - name: tmp
          emptyDir: {}
