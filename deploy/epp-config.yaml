# EndpointPickerConfig for an EPP built from this repo.
#
# This is the P/D configuration llm-d ships (deploy/config/pd-epp-config.yaml in
# llm-d-router) with one plugin added. The scheduling half is unchanged: the
# stream handler provisioner does not participate in picking an endpoint, it only
# reacts to the pick the disagg profile handler already made.
#
# Two names have to agree and are not checked at startup:
#   * decodeProfile below and the disagg handler's profiles.decode (both "decode")
#   * sessionLabel below and the label the ingestor's job template stamps on Jobs
# A mismatch on the first means the plugin cannot find the endpoint and logs
# instead of provisioning; a mismatch on the second means handlers are created
# and never reaped.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
  - type: approx-prefix-cache-producer
    parameters:
      maxPrefixTokensToMatch: 16384
      lruCapacityPerServer: 31250
  - type: prefix-cache-scorer
  - type: queue-scorer
  - type: prefill-filter
  - type: decode-filter
  - type: max-score-picker
  - type: disagg-profile-handler
    parameters:
      deciders:
        prefill: prefix-based-pd-decider
  - type: prefix-based-pd-decider
    parameters:
      nonCachedTokens: 16

  - type: stream-handler-provisioner
    parameters:
      # Where handler Jobs are created and where the job template is read from.
      # The EPP's ServiceAccount needs the provisioner Role bound here; see
      # deploy/rbac.yaml.
      namespace: cellphone-cam
      jobTemplateConfigMap: cellphone-camera-handler-job-template
      jobTemplateKey: job.yaml

      # Must match the disagg handler's profiles.decode above. The endpoint this
      # profile picks becomes the handler's POOL_ENDPOINT.
      decodeProfile: decode

      # Where the handler forwards the inference server's response so it reaches
      # the browser. The session id is appended, giving the handler a
      # RESULT_SINK_URL of <base>/<session-id>. Omit to inject nothing.
      resultSinkBaseURL: http://cellphone-camera-frontend.cellphone-cam.svc.cluster.local:8080/ingest

      # A camera address is typed into a browser field and becomes an outbound
      # connection from inside the cluster. Keep this list as narrow as the
      # cameras you actually support.
      allowedStreamSchemes: [http, https, rtsp]

      # Must match the label the ingestor's job template stamps on each Job.
      sessionLabel: cellphone-camera.io/session-id

      # How long a fetched job template is reused. Editing the ConfigMap takes
      # effect for sessions starting after this window, with no restart.
      templateCacheTTL: 30s

schedulingProfiles:
  - name: prefill
    plugins:
      - pluginRef: prefill-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
  - name: decode
    plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
